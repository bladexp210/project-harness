name: validate-md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Markdown validator
        run: python scripts/validate_md.py --all

      - name: Unit tests (scripts)
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Unit tests (Acme PTO FAQ example)
        run: python -m unittest discover -s examples/acme-pto-faq -p "test_*.py" -v
