# Track A stack — OpenHands → LiteLLM → OpenRouter + Langfuse observability
# OpenHands LLM profiles: Base URL http://host.docker.internal:4000 (agent-server is not on compose network).
# Langfuse UI: http://127.0.0.1:3001 (OpenHands keeps :3000).
# Image tags: see https://docs.openhands.dev/openhands/usage/run-openhands/local-setup
# LiteLLM: https://docs.litellm.ai/docs/proxy/deploy
# Langfuse: https://langfuse.com/self-hosting/deployment/docker-compose
# Langfuse: https://langfuse.com/self-hosting/deployment/docker-compose
#
# Production-grade patterns (S47 — distilled from inbox Docker research):
# - Layer graph: COPY dependency manifests before source; healthchecks + depends_on conditions.
# - Resource limits on long-running services; json-file logging with max-size rotation.
# - no-new-privileges on app containers; dev host ports bound to 127.0.0.1 only.
# - Secrets via .env (never commit); required vars use ${VAR:?message} at boot.
# - Internal observability stack stays off host ports except langfuse-web :3001.
# Runbook: 07-ship-operate/runbook/example-harness-track-a-runbook.md § Docker hygiene.

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-dev-only}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellm-dev-only}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse-web:3000
    command: --config /app/config.yaml
    depends_on:
      db:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openhands:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/openhands:1.8}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-1.26.0-python}
      - LOG_ALL_EVENTS=true
      # Agent-server cold start (Chromium + VSCode preload) can exceed 15s on Windows.
      - SANDBOX_STARTUP_GRACE_SECONDS=${SANDBOX_STARTUP_GRACE_SECONDS:-60}
      # Mount host repo into each spawned agent-server sandbox (cwd is /workspace/project).
      # Without this, the UI may show files under /opt/workspace_base but the agent sees an empty git init.
      - SANDBOX_VOLUMES=${WORKSPACE_PATH}:/workspace/project:rw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENHANDS_STATE_DIR:-./.openhands-state}:/.openhands
      - ${WORKSPACE_PATH}:/opt/workspace_base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Langfuse v3 (internal network — only langfuse-web exposes a host port) ---

  langfuse-postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse-dev-only}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  langfuse-redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-langfuse-redis-dev}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse-redis-dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse-ch-dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-langfuse-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-langfuse-minio-dev}
    volumes:
      - langfuse_minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_started
    entrypoint: /bin/sh
    command: >
      -c "
      sleep 3 &&
      mc alias set local http://langfuse-minio:9000 ${LANGFUSE_MINIO_USER:-langfuse-minio} ${LANGFUSE_MINIO_PASSWORD:-langfuse-minio-dev} &&
      mc mb --ignore-existing local/langfuse
      "
    restart: "no"

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-langfuse-dev-only}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env before first langfuse boot}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env before first langfuse boot}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse-ch-dev}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-langfuse-minio-dev}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-langfuse-minio-dev}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-langfuse-redis-dev}
    deploy:
      resources:
        limits:
          memory: 768M

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
      langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env before first langfuse boot}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-harness}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-track-a}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      NODE_OPTIONS: ${LANGFUSE_NODE_OPTIONS:---max-old-space-size=1024}
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  litellm_postgres_data:
  langfuse_postgres_data:
  langfuse_redis_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
